<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForkWorld · 合影配对大屏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", -apple-system, "Noto Sans SC", sans-serif;
    background: #F5F0E8;
    background-image: radial-gradient(#E4DCCB 1.2px, transparent 1.2px);
    background-size: 26px 26px;
    color: #1C1911;
    display: flex; gap: 26px; padding: 26px;
  }

  /* ---- 左：摄像头画面 ---- */
  .stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .cam-card {
    flex: 1; background: #1C1911; border: 3px solid #1C1911; border-radius: 22px;
    box-shadow: 10px 10px 0 rgba(28,25,17,.85); overflow: hidden; position: relative;
  }
  .cam-card img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .cam-tag {
    position: absolute; top: 16px; left: 16px;
    background: rgba(28,25,17,.75); color: #F5F0E8; font-size: 14px; letter-spacing: 2px;
    padding: 7px 14px; border-radius: 999px; display: flex; align-items: center; gap: 8px;
    backdrop-filter: blur(4px);
  }
  .reddot { width: 9px; height: 9px; border-radius: 50%; background: #E5484D;
            animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: .3 } 50% { opacity: 1 } }

  /* ---- 右：信息栏 ---- */
  .side { width: 340px; display: flex; flex-direction: column; gap: 18px; }
  .brand h1 { font-size: 30px; letter-spacing: 4px; }
  .brand p  { font-size: 13px; color: #8B8578; margin-top: 6px; letter-spacing: 1px; }

  .status-card {
    background: #fff; border: 2.5px solid #1C1911; border-radius: 18px;
    box-shadow: 6px 6px 0 rgba(28,25,17,.85); padding: 20px; transform: rotate(-.6deg);
  }
  .status-card .big { font-size: 20px; font-weight: 700; line-height: 1.45; min-height: 58px;
                      display: flex; align-items: center; gap: 10px; }
  .pulse { width: 12px; height: 12px; border-radius: 50%; background: #7BC47F; flex: none;
           animation: breath 1.6s ease-in-out infinite; }
  .pulse.warn { background: #E8A33C; }
  @keyframes breath { 0%,100% { opacity: .25; transform: scale(.8) } 50% { opacity: 1; transform: scale(1.2) } }

  .steps { background: #fff; border: 2.5px solid #1C1911; border-radius: 18px;
           box-shadow: 6px 6px 0 rgba(28,25,17,.85); padding: 18px 20px; transform: rotate(.6deg); }
  .steps h3 { font-size: 13px; color: #D95D39; letter-spacing: 3px; margin-bottom: 10px; }
  .steps li { list-style: none; font-size: 15px; line-height: 2; }
  .steps b { display: inline-block; width: 22px; height: 22px; text-align: center; line-height: 20px;
             background: #1C1911; color: #F5F0E8; border-radius: 50%; font-size: 12px; margin-right: 8px; }

  .recent { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .recent h3 { font-size: 13px; color: #8B8578; letter-spacing: 3px; margin: 4px 0 10px; }
  .recent-list { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .rec {
    background: #fff; border: 2px solid #1C1911; border-radius: 14px; padding: 10px 14px;
    box-shadow: 4px 4px 0 rgba(28,25,17,.8); display: flex; align-items: center; gap: 10px;
    animation: pop .35s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0 } to { transform: none; opacity: 1 } }
  .rec .names { font-size: 15px; font-weight: 600; flex: 1; }
  .rec .sc { font-size: 21px; font-weight: 800; color: #D95D39; }

  /* ---- 配对演出遮罩 ---- */
  .overlay {
    position: fixed; inset: 0; background: rgba(245,240,232,.96);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; text-align: center; z-index: 10;
    animation: rise .5s cubic-bezier(.2,.9,.3,1.15);
  }
  .overlay.show { display: flex; }
  @keyframes rise { from { transform: translateY(50px); opacity: 0 } to { transform: none; opacity: 1 } }
  .ov-pair { font-size: 40px; font-weight: 700; letter-spacing: 2px; }
  .ov-score { font-size: 150px; font-weight: 800; line-height: 1; color: #D95D39;
              text-shadow: 7px 7px 0 rgba(28,25,17,.14); }
  .ov-score small { font-size: 32px; color: #1C1911; font-weight: 600; }
  .ov-reason { font-size: 22px; max-width: 640px; line-height: 1.7; }
  .ov-topic { background: #fff; border: 2.5px solid #1C1911; border-radius: 16px;
              box-shadow: 6px 6px 0 rgba(28,25,17,.85); padding: 16px 28px;
              max-width: 620px; transform: rotate(.8deg); }
  .ov-topic b { display: block; font-size: 14px; color: #D95D39; letter-spacing: 3px; margin-bottom: 6px; }
  .ov-topic span { font-size: 21px; }
  .ov-chat { display: flex; flex-direction: column; gap: 10px; max-width: 680px; max-height: 24vh; overflow: hidden; }
  .ov-line { display: flex; gap: 10px; align-items: flex-start; text-align: left;
             animation: pop .3s both; }
  .ov-line .e { width: 32px; height: 32px; flex: 0 0 32px; font-size: 26px; }
  .ov-line .e img { width: 100%; height: 100%; object-fit: contain;
                    border-radius: 50%; border: 2px solid #1C1911; background: #EFE9DD; }
  .ov-line .t { background: #fff; border: 2px solid #1C1911; border-radius: 4px 14px 14px 14px;
                padding: 9px 15px; font-size: 17px; line-height: 1.5; }
  .ov-learned { font-size: 17px; background: #FBE8A6; border: 2px solid #1C1911;
                border-radius: 999px; padding: 10px 24px; }
  .ov-wait { font-size: 24px; letter-spacing: 2px; display: flex; align-items: center; gap: 14px; }
  .spinner { width: 26px; height: 26px; border: 4px solid #1C1911; border-top-color: transparent;
             border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }

  /* ---- 碰撞演出 ---- */
  #fx { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
  .ov-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; position: relative; }
  .ov-inner.shake { animation: shake .45s both; }
  @keyframes shake {
    10%,90% { transform: translate(-2px, 1px) } 20%,80% { transform: translate(5px, -2px) }
    30%,70% { transform: translate(-8px, 3px) } 40%,60% { transform: translate(8px, -4px) }
    50% { transform: translate(-5px, 4px) }
  }
  .heroes { display: flex; align-items: center; gap: 26px; height: 120px; position: relative; }
  .hero { width: 108px; height: 108px; display: inline-block; opacity: 0; }
  .hero img { width: 100%; height: 100%; object-fit: contain;
              border-radius: 50%; border: 3px solid #1C1911; background: #EFE9DD; }
  .hero .fb { font-size: 92px; line-height: 108px; }
  /* 从屏幕两边走到中间：身体平移 + 内部 img 颠簸（走路感） */
  .hero.walk-l { animation: walkL 3s cubic-bezier(.35,.7,.35,1) both; }
  .hero.walk-r { animation: walkR 3s cubic-bezier(.35,.7,.35,1) both; }
  @keyframes walkL { from { opacity: 1; transform: translateX(-62vw) } to { opacity: 1; transform: none } }
  @keyframes walkR { from { opacity: 1; transform: translateX(62vw) } to { opacity: 1; transform: none } }
  .hero.walk-l img, .hero.walk-r img { animation: step .36s ease-in-out infinite; }
  @keyframes step { 0%,100% { transform: translateY(0) rotate(-3deg) } 50% { transform: translateY(-8px) rotate(3deg) } }
  /* 碰头后并排站着：轻轻起伏（等待 LLM 生成期间的 idle） */
  .hero.together { opacity: 1; animation: idleBob 1.5s ease-in-out infinite alternate; }
  @keyframes idleBob { from { transform: translateY(0) } to { transform: translateY(-6px) } }
  /* 结果揭晓：高兴得跳起来 */
  .hero.jump { opacity: 1; animation: jump .65s cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes jump { 0% { transform: translateY(0) } 40% { transform: translateY(-46px) } 100% { transform: translateY(0) } }
  /* 相遇期间从中间冒起的小爱心 */
  .heart { position: absolute; font-size: 22px; pointer-events: none; z-index: 5;
           animation: heartUp 1.6s ease-out both; }
  @keyframes heartUp { from { opacity: 0; transform: translateY(6px) scale(.5) } 20% { opacity: 1 }
                       to { opacity: 0; transform: translateY(-90px) scale(1.15) rotate(12deg) } }
  .beam {
    width: 0; height: 10px; border-radius: 999px;
    background: linear-gradient(90deg, #E8A33C, #D95D39, #E8A33C);
    box-shadow: 0 0 18px rgba(217,93,57,.65);
  }
  .beam.on { animation: beamOn .5s .1s cubic-bezier(.2,.9,.3,1.3) both, beamGlow 1.4s .6s ease-in-out infinite; }
  @keyframes beamOn { from { width: 0; opacity: 0 } to { width: 110px; opacity: 1 } }
  @keyframes beamGlow { 0%,100% { box-shadow: 0 0 10px rgba(217,93,57,.4) }
                        50% { box-shadow: 0 0 30px rgba(217,93,57,.95) } }
  .shock {
    position: absolute; left: 50%; top: 50%; width: 90px; height: 90px;
    margin: -45px 0 0 -45px; border: 5px solid #D95D39; border-radius: 50%;
    opacity: 0; pointer-events: none;
  }
  .shock.go { animation: ring .75s ease-out both; }
  .shock.go2 { animation: ring .9s .12s ease-out both; border-color: #E8A33C; }
  @keyframes ring { from { opacity: .95; transform: scale(.2) } to { opacity: 0; transform: scale(6.5) } }
  .flashfx { position: absolute; inset: 0; background: radial-gradient(circle at 50% 38%, #fff, transparent 62%);
             opacity: 0; pointer-events: none; z-index: 2; }
  .flashfx.go { animation: flash .5s ease-out both; }
  @keyframes flash { from { opacity: .95 } to { opacity: 0 } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(26px) } to { opacity: 1; transform: none } }
  @keyframes scorePop { 0% { transform: scale(.3); opacity: 0 } 60% { transform: scale(1.18) }
                        100% { transform: scale(1); opacity: 1 } }

  /* 窄屏/竖屏（内嵌预览、竖置大屏）：改上下布局 */
  @media (max-width: 980px) {
    body { flex-direction: column; overflow-y: auto; }
    .stage { flex: none; }
    .cam-card { height: 44vh; flex: none; }
    .side { width: 100%; }
    .ov-score { font-size: 96px; }
    .ov-pair { font-size: 28px; }
  }

  /* 内嵌模式（?embed=1，六环大屏盖层用）：藏掉右侧信息栏，相机画面铺满，
     不再有「单独页面」的观感；配对演出遮罩不受影响照常弹出 */
  body.embed { padding: 0; gap: 0; }
  body.embed .side { display: none; }
  body.embed .cam-card { border-radius: 0; border: none; box-shadow: none; }
</style>
</head>
<body>
  <div class="stage">
    <div class="cam-card">
      <img id="cam" alt="camera">
      <div class="cam-tag"><span class="reddot"></span>LINK 2 PRO · 实时画面</div>
    </div>
  </div>

  <div class="side">
    <div class="brand">
      <h1>ForkWorld</h1>
      <p>合影配对 · 你的世界，就是你的自我介绍</p>
    </div>

    <div class="status-card">
      <div class="big"><span class="pulse" id="pulse"></span><span id="status">等待合影 · 把二维码举到镜头前</span></div>
    </div>

    <div class="steps">
      <h3>怎么玩</h3>
      <li><b>1</b>手机打开 <span id="url">:8600</span> 选你的 agent</li>
      <li><b>2</b>两个人一起把二维码举到镜头前</li>
      <li><b>3</b>看你们的灵魂契不契合</li>
    </div>

    <div class="recent">
      <h3>最近的相遇</h3>
      <div class="recent-list" id="recent"></div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <canvas id="fx"></canvas>
    <div class="flashfx" id="flashfx"></div>
    <div class="ov-inner" id="ov_inner">
      <div class="heroes" id="heroes">
        <span class="hero" id="hero_a"></span>
        <span class="beam" id="beam"></span>
        <span class="hero" id="hero_b"></span>
        <span class="shock" id="shock"></span>
        <span class="shock" id="shock2"></span>
      </div>
      <div class="ov-wait" id="ov_wait"><span class="spinner"></span>两个世界正在相遇…</div>
      <div id="ov_body" style="display:none; flex-direction:column; align-items:center; gap:18px;">
        <div class="ov-pair" id="ov_pair"></div>
        <div class="ov-score" id="ov_score_wrap"><span id="ov_score">0</span><small> / 100 灵魂契合</small></div>
        <div class="ov-reason" id="ov_reason"></div>
        <div class="ov-topic"><b>值得聊的那件事</b><span id="ov_topic"></span></div>
        <div class="ov-chat" id="ov_chat"></div>
        <div class="ov-learned" id="ov_learned" style="display:none"></div>
      </div>
    </div>
  </div>

<script>
  // 内嵌模式：六环大屏盖层以 ?embed=1 打开时，只保留相机画面（藏侧栏）
  if (new URLSearchParams(location.search).get("embed")) document.body.classList.add("embed");

  // 支持双开法：http://<IP>:8700/（正式）或直接双击打开 html 文件（回落到本机服务）
  const HOST = (location.protocol === "file:" || !location.hostname)
      ? "127.0.0.1" : location.hostname;
  const BASE = (location.protocol === "file:") ? "http://" + HOST + ":8700" : "";
  const BACKEND = "http://" + HOST + ":8000";
  document.getElementById("cam").src = BASE + "/stream.mjpg";
  document.getElementById("url").textContent = HOST + ":8600";

  let agents = {};
  fetch(BACKEND + "/api/agents").then(r => r.json())
    .then(list => list.forEach(a => agents[a.id] = a)).catch(() => {});

  const $ = id => document.getElementById(id);
  let hideTimer = null;

  function agentLabel(id) {
    const a = agents[id];
    return a ? a.name : "Agent " + id;
  }

  /* agent.image 是后端的相对 URL；大屏可能 file:// 直开，必须显式拼到 BACKEND 上 */
  function avatarUrl(image) {
    if (!image) return "";
    return /^https?:\/\//.test(image) ? image : BACKEND + image;
  }

  /* 有形象图就渲染图，没有（回填还没跑完）就退回占位字形，绝不出现裂图 */
  function avatarInto(el, image) {
    const url = avatarUrl(image);
    el.innerHTML = url ? '<img alt="">' : '<span class="fb">❔</span>';
    if (url) el.querySelector("img").src = url;
  }

  function setStatus(text, warn) {
    $("status").textContent = text;
    $("pulse").classList.toggle("warn", !!warn);
  }

  function countUp(el, target) {
    let v = 0; const step = Math.max(1, Math.round(target / 50));
    const t = setInterval(() => {
      v = Math.min(target, v + step);
      el.textContent = v;
      if (v >= target) clearInterval(t);
    }, 26);
  }

  /* ---- 彩纸粒子（canvas，无依赖） ---- */
  const PALETTE = ["#D95D39", "#E8A33C", "#7BC47F", "#1C1911", "#FBE8A6", "#ffffff"];
  let fxToken = 0;
  function stopFx() { fxToken++; }
  function burst() {
    const cv = $("fx"), ctx = cv.getContext("2d");
    cv.width = cv.offsetWidth; cv.height = cv.offsetHeight;
    // 粒子从两个主角的正中间喷出（实时取坐标，不受布局影响）
    const hr = $("heroes").getBoundingClientRect(), or = cv.getBoundingClientRect();
    const cx = hr.left + hr.width / 2 - or.left;
    const cy = hr.top + hr.height / 2 - or.top;
    const ps = [];
    for (let i = 0; i < 160; i++) {
      const ang = Math.random() * Math.PI * 2, sp = 5 + Math.random() * 13;
      ps.push({ x: cx, y: cy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 4,
                w: 6 + Math.random() * 9, h: 4 + Math.random() * 6,
                rot: Math.random() * Math.PI, vr: (Math.random() - .5) * .35,
                c: PALETTE[i % PALETTE.length], life: 90 + Math.random() * 60 });
    }
    const token = ++fxToken;
    (function tick() {
      if (token !== fxToken) { ctx.clearRect(0, 0, cv.width, cv.height); return; }
      ctx.clearRect(0, 0, cv.width, cv.height);
      let alive = 0;
      for (const p of ps) {
        if (p.life <= 0) continue;
        alive++;
        p.life--; p.x += p.vx; p.y += p.vy; p.vy += 0.32; p.vx *= 0.99; p.rot += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.globalAlpha = Math.min(1, p.life / 40);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      if (alive > 0) requestAnimationFrame(tick);
      else ctx.clearRect(0, 0, cv.width, cv.height);
    })();
  }

  function setHeroes(ia, ib) {
    const ha = $("hero_a"), hb = $("hero_b");
    avatarInto(ha, ia); avatarInto(hb, ib);
    ha.className = "hero"; hb.className = "hero";
    void ha.offsetWidth;                       // 重置动画
  }

  /* 相遇期间从两只中间持续冒小爱心 */
  let heartTimer = null;
  function startHearts() {
    stopHearts();
    heartTimer = setInterval(() => {
      const h = document.createElement("span");
      h.className = "heart";
      h.textContent = ["🧡", "❤️", "💛"][Math.floor(Math.random() * 3)];
      h.style.left = (44 + Math.random() * 12) + "%";
      h.style.top = "55%";
      $("heroes").appendChild(h);
      h.addEventListener("animationend", () => h.remove());
    }, 650);
  }
  function stopHearts() {
    clearInterval(heartTimer); heartTimer = null;
    document.querySelectorAll("#heroes .heart").forEach(h => h.remove());
  }

  function showPairing(ida, idb) {
    clearTimeout(hideTimer);
    stopFx(); stopHearts();
    $("beam").className = "beam";
    $("ov_wait").style.display = "flex";
    $("ov_body").style.display = "none";
    const a = agents[ida] || {}, b = agents[idb] || {};
    setHeroes(a.image, b.image);
    $("overlay").classList.add("show");
    // 两只从屏幕两边走到一块（3s），碰头后并排站着 + 冒爱心，等 LLM 生成
    const ha = $("hero_a"), hb = $("hero_b");
    ha.classList.add("walk-l"); hb.classList.add("walk-r");
    setTimeout(() => {
      if (ha.classList.contains("walk-l")) {   // 结果还没到才转 idle
        ha.className = "hero together"; hb.className = "hero together";
        startHearts();
      }
    }, 3050);
    setStatus("捕捉到两个世界！正在生成相遇故事…", true);
  }

  function reveal(el, delay) {
    el.style.animation = "none"; void el.offsetWidth;
    el.style.animation = `fadeUp .55s ${delay}s cubic-bezier(.2,.9,.3,1.15) both`;
  }

  function showResult(r) {
    clearTimeout(hideTimer);
    const ag = r.agents || [];
    const names = ag.map(a => a.name).join("　×　");
    const sc = (r.resonance || {}).score || 0;

    /* 内容先填好但隐藏，等撞击后逐层浮现 */
    $("ov_wait").style.display = "none";
    $("ov_body").style.display = "flex";
    $("ov_pair").textContent = names;
    $("ov_score").textContent = "0";
    $("ov_reason").textContent = (r.resonance || {}).reason || "";
    $("ov_topic").textContent = (r.resonance || {}).topic || "";
    const chat = $("ov_chat"); chat.innerHTML = "";
    (r.lines || []).forEach((l, i) => {
      const d = document.createElement("div"); d.className = "ov-line";
      d.style.animationDelay = (1.6 + i * 0.55) + "s";
      d.innerHTML = '<span class="e"></span><span class="t"></span>';
      avatarInto(d.querySelector(".e"), l.image);
      d.querySelector(".t").textContent = l.name + "：" + l.text;
      chat.appendChild(d);
    });
    const lb = $("ov_learned");
    if (r.learned) { lb.style.display = ""; lb.textContent = "✨ " + r.learned.learner + " 学会了「" + r.learned.skill + "」"; }
    else lb.style.display = "none";

    /* 演出序列：两只已经站在一起 → 高兴得跳起来 → 跳到最高点时冲击波+彩纸 → 内容浮现 */
    $("overlay").classList.add("show");
    stopHearts();
    $("beam").className = "beam";
    const ha = $("hero_a"), hb = $("hero_b");
    if (!ha.innerHTML || !hb.innerHTML)        // 页面中途刷新错过 pairing 事件也能兜底
      setHeroes(ag[0] && ag[0].image, ag[1] && ag[1].image);
    ha.className = "hero jump"; hb.className = "hero jump";
    setTimeout(() => { ha.className = "hero together"; hb.className = "hero together"; startHearts(); }, 800);

    setTimeout(() => {                                   // 跳到最高点的瞬间
      $("ov_inner").classList.remove("shake"); void $("ov_inner").offsetWidth;
      $("ov_inner").classList.add("shake");
      $("flashfx").className = "flashfx"; void $("flashfx").offsetWidth;
      $("flashfx").classList.add("go");
      $("shock").className = "shock"; $("shock2").className = "shock";
      void $("shock").offsetWidth;
      $("shock").classList.add("go"); $("shock2").classList.add("go2");
      $("beam").classList.add("on");
      burst();
      $("ov_score_wrap").style.animation = "none"; void $("ov_score_wrap").offsetWidth;
      $("ov_score_wrap").style.animation = "scorePop .6s .15s cubic-bezier(.2,.9,.3,1.4) both";
      setTimeout(() => countUp($("ov_score"), sc), 300);
      reveal($("ov_pair"), 0.1);
      reveal($("ov_reason"), 0.9);
      reveal($("ov_topic"), 1.2);
      if (r.learned) reveal(lb, 1.5);
    }, 260);

    addRecent(names, sc);
    setStatus("灵魂契合 " + sc + " 分！下一组请举牌", false);
    hideTimer = setTimeout(() => { $("overlay").classList.remove("show"); stopFx(); stopHearts(); }, 18000);
  }

  function addRecent(names, score) {
    const d = document.createElement("div"); d.className = "rec";
    d.innerHTML = '<span class="names"></span><span class="sc"></span>';
    d.querySelector(".names").textContent = names;
    d.querySelector(".sc").textContent = score;
    const list = $("recent");
    list.prepend(d);
    while (list.children.length > 6) list.lastChild.remove();
  }

  function connect() {
    const es = new EventSource(BASE + "/events");
    es.onmessage = e => {
      const ev = JSON.parse(e.data);
      if (ev.type === "waiting") {
        setStatus("已看到 " + agentLabel(ev.agent_id) + " · 等待另一位举牌…", true);
      } else if (ev.type === "pairing") {
        showPairing(ev.a, ev.b);
      } else if (ev.type === "pair") {
        showResult(ev.result);
      } else if (ev.type === "pair_failed") {
        $("overlay").classList.remove("show");
        setStatus("生成失败了，再举一次试试", true);
      }
    };
    es.onerror = () => { es.close(); setTimeout(connect, 2000); };
  }
  connect();
</script>
</body>
</html>
