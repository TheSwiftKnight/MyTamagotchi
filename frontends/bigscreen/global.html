<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e7">
  <title>ForkWorld · 六环同心广场</title>
  <style>
    :root {
      --paper:#f4f0e7; --card:rgba(250,247,239,.92); --ink:#34352f;
      --soft:#777268; --line:rgba(75,73,65,.20); --sage:#87976e;
      --straw:#d8c997; --coral:#c9876d;
      --font:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--font)}
    button{font:inherit;color:inherit}
    #app{width:100%;height:100%}
    .map-shell{position:relative;width:100%;height:100%;overflow:hidden;background:#e9e4d8;touch-action:none}
    .map-stage{position:absolute;width:1672px;height:941px;transform-origin:0 0;will-change:transform}
    .map-art{position:absolute;inset:0;background:url("assets/maps/six-ring-commons.png") center/cover no-repeat;filter:saturate(.72) contrast(.94) brightness(1.04)}
    .map-art::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse,transparent 58%,rgba(76,68,53,.08));pointer-events:none}
    .house-hotspot{position:absolute;width:48px;height:42px;padding:0;translate:-50% -50%;border:0;background:transparent;cursor:pointer;transition:transform .16s;filter:drop-shadow(0 2px 2px rgba(73,58,38,.18))}
    .house-hotspot:hover,.house-hotspot:focus-visible,.house-hotspot.is-active{z-index:5;transform:translateY(-4px) scale(1.18);outline:none}
    .house-hotspot::after{content:"";position:absolute;right:2px;top:4px;width:7px;height:7px;border:1px solid rgba(255,255,255,.9);border-radius:50%;background:#aaa69c;opacity:.58}
    .house-glyph{position:absolute;inset:0;background:url("assets/maps/cottage-marker.png") center/contain no-repeat}
    .house-glyph i{display:none}
    .house-hotspot.is-occupied{filter:drop-shadow(0 2px 2px rgba(73,58,38,.18)) drop-shadow(0 0 4px var(--accent))}
    .house-hotspot.is-occupied::after{background:var(--accent);opacity:1}
    .house-hotspot.is-active::before{content:"";position:absolute;inset:-3px;border:2px dashed rgba(250,247,239,.96);border-radius:50%}
    .house-number{position:absolute;top:44px;left:50%;translate:-50% 0;padding:3px 7px;border:1px solid var(--line);border-radius:7px;background:rgba(250,247,239,.96);color:#58544c;font-size:9px;white-space:nowrap;opacity:0;transition:.16s;box-shadow:0 4px 12px rgba(66,60,48,.12)}
    .house-hotspot:hover .house-number,.house-hotspot:focus-visible .house-number,.house-hotspot.is-active .house-number{opacity:1}
    .debug-hotspots .house-hotspot{background:rgba(232,99,74,.25)}
    .topbar,.status,.controls,.hint,.panel,.detail{position:fixed;z-index:20;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 24px rgba(66,60,48,.10);backdrop-filter:blur(12px)}
    .topbar{top:max(12px,env(safe-area-inset-top));left:14px;display:flex;align-items:center;gap:12px;padding:9px 13px;border-radius:14px}
    .brand{font-weight:800;letter-spacing:.12em;font-size:13px}.brand i{color:var(--coral);font-style:normal}
    .topbar small,.status{color:var(--soft);font-size:10px}
    .clock{padding-left:10px;border-left:1px solid var(--line);font-variant-numeric:tabular-nums}
    .status{top:67px;left:14px;padding:6px 10px;border-radius:10px}
    .panel{top:14px;right:14px;width:236px;padding:13px;border-radius:16px}
    .panel h2{margin:0 0 8px;font-size:13px}.occupancy{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .occupancy span{padding:9px;border-radius:10px;background:rgba(255,255,255,.4);font-size:10px;color:var(--soft)}
    .occupancy b{display:block;color:var(--ink);font-size:20px}.panel p{margin:9px 2px 0;color:var(--soft);font-size:10px;line-height:1.5}
    .ring-list{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
    .ring-item{display:flex;align-items:center;gap:5px;padding:6px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.38);text-align:left;cursor:pointer}
    .ring-item:hover{background:#fff}.ring-item b{display:grid;width:20px;height:20px;place-items:center;border-radius:50%;background:var(--sage);color:#fff;font-size:10px}
    .ring-item span{font-size:9px;line-height:1.1}.ring-item small{display:block;margin-top:2px;color:var(--soft);font-size:8px}
    .controls{right:14px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:6px;padding:6px;border-radius:14px}
    .controls button,.detail-close{border:1px solid var(--line);border-radius:9px;background:#faf7ef;cursor:pointer}
    .controls button{min-width:36px;height:36px;padding:0 10px}.controls button:hover{background:#ece6d8}
    .hint{left:50%;bottom:16px;translate:-50% 0;padding:7px 12px;border-radius:11px;color:var(--soft);font-size:10px;pointer-events:none}
    .detail{left:14px;bottom:62px;width:min(340px,calc(100vw - 28px));max-height:58vh;padding:18px;border-radius:18px;overflow:auto;opacity:0;translate:0 12px;pointer-events:none;transition:.18s}
    .detail.show{opacity:1;translate:0 0;pointer-events:auto}.detail-close{position:absolute;top:10px;right:10px;width:30px;height:30px}
    .detail h1{margin:0 35px 2px 0;font-size:24px}.detail-owner{margin:0 0 12px;color:var(--soft);font-size:11px}
    .detail-climate{line-height:1.6;font-size:13px}.detail h3{margin:16px 0 7px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--coral)}
    .landmark{display:flex;gap:8px;margin:7px 0;font-size:12px}.landmark i{font-style:normal;font-size:18px}.landmark small{display:block;color:var(--soft)}
    .resonance{padding:9px;border-radius:10px;background:rgba(216,201,151,.26);font-size:11px;line-height:1.5}
    .empty{color:var(--soft);font-size:11px}
    .pair-btn{padding:0 12px;background:#c9876d!important;color:#fff!important;border-color:#b3755d!important;font-weight:700;letter-spacing:.06em}
    .pair-btn:hover{background:#b3755d!important}
    .pair-overlay{position:fixed;inset:0;z-index:60;background:#f4f0e7}
    .pair-overlay iframe{width:100%;height:100%;border:0;display:block}
    .pair-close{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:61;padding:9px 16px;border:1px solid var(--line);border-radius:11px;background:var(--card);cursor:pointer;font-weight:700;box-shadow:0 8px 24px rgba(66,60,48,.14)}
    .pair-close:hover{background:#ece6d8}
    .pair-offline{position:fixed;inset:0;z-index:59;display:grid;place-items:center;text-align:center;color:var(--soft);font-size:15px;line-height:2;pointer-events:none}
    .pair-offline[hidden]{display:none}   /* class 的 display:grid 会盖掉 hidden 属性，必须显式补 */
    .enter-world{display:flex;width:100%;height:42px;margin-top:14px;align-items:center;justify-content:center;border:1px solid #667154;border-radius:11px;background:#899878;color:#fff;font-weight:700;cursor:pointer}
    .enter-world:hover{background:#758663}.empty-house{padding:22px 0 8px;text-align:center}.empty-house strong{display:block;margin:7px 0;font-size:20px}.empty-house i{font-style:normal;font-size:38px}
    @media (max-width:720px){
      .topbar{right:10px;left:10px;top:max(8px,env(safe-area-inset-top));justify-content:space-between}.topbar small{display:none}
      .status{top:58px;left:10px}.panel{top:auto;right:10px;bottom:10px;left:10px;width:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-radius:14px}
      .panel h2,.panel p,.ring-list{display:none}.occupancy{display:flex;gap:14px}.occupancy span{padding:0;background:none}.occupancy b{display:inline;margin-right:4px;font-size:14px}
      .controls{right:10px;bottom:65px}.hint{display:none}.detail{bottom:64px;max-height:62vh}
    }
  </style>
</head>
<body>
  <main id="app">
    <section class="map-shell" id="viewport" aria-label="ForkWorld 六环同心广场">
      <div class="map-stage" id="stage">
        <div class="map-art"></div>
        <div id="house-hotspots"></div>
      </div>
    </section>
    <header class="topbar">
      <span class="brand">FORK<i>WORLD</i></span><small>六环同心广场 · 每个世界，都是一个人</small><span class="clock" id="clock"></span>
    </header>
    <div class="status" id="status">正在载入广场…</div>
    <aside class="panel">
      <h2>六圈房区 · <span id="ring-count">0</span> 环</h2>
      <div class="occupancy"><span><b id="occupied-count">0</b>已入住</span><span><b id="empty-count">0</b>空房</span></div>
      <div class="ring-list" id="ring-list"></div>
      <p>点击任意房屋查看入住状态与 Agent 世界。</p>
    </aside>
    <aside class="detail" id="detail"><button class="detail-close" id="detail-close" aria-label="关闭">×</button><div id="detail-body"></div></aside>
    <nav class="controls" aria-label="地图控制">
      <button id="zoom-in" aria-label="放大">＋</button><button id="zoom-out" aria-label="缩小">－</button>
      <button id="fit" aria-label="复位">⌂</button><button id="cruise" aria-label="巡航">▶</button>
      <button id="pair-open" class="pair-btn" aria-label="合影配对">📷 合影配对</button>
    </nav>
    <div class="hint">拖拽平移 · 滚轮或双指缩放 · 点击世界查看详情</div>

    <!-- 合影配对：全屏盖层，内嵌 qr_pair 识别大屏（daemon :8700） -->
    <div class="pair-overlay" id="pair-overlay" hidden>
      <iframe id="pair-frame" title="合影配对" allow="autoplay"></iframe>
      <button class="pair-close" id="pair-close" aria-label="返回广场">× 返回广场</button>
      <div class="pair-offline" id="pair-offline" hidden>
        配对服务未启动<br><small>在 tools/qr_pair 下运行 daemon.py 后重试</small>
      </div>
    </div>
  </main>
  <script src="js/shared/tokens.js"></script>
  <script src="js/shared/data.js"></script>
  <script src="js/global/light_app.js"></script>
  <script>
  /* 合影配对入口：盖层内嵌 qr_pair 识别大屏（daemon :8700，与后端同机） */
  (function () {
    var PAIR_URL = location.protocol + "//" + (location.hostname || "127.0.0.1") + ":8700/";
    var overlay = document.getElementById("pair-overlay");
    var frame = document.getElementById("pair-frame");
    var offline = document.getElementById("pair-offline");
    document.getElementById("pair-open").addEventListener("click", function () {
      overlay.hidden = false;
      offline.hidden = true;
      // 在线探测：跨域 iframe 加载成功会触发 load；6 秒没触发才提示离线。
      // 加时间戳强制重新加载——重复打开时 src 不变不会触发 onload，离线提示会误弹
      var timer = setTimeout(function () { offline.hidden = false; }, 6000);
      frame.onload = function () { clearTimeout(timer); offline.hidden = true; };
      frame.src = PAIR_URL + "?embed=1&t=" + Date.now();
    });
    document.getElementById("pair-close").addEventListener("click", function () {
      overlay.hidden = true;
      frame.src = "";   // 卸载 iframe：停止 MJPEG 拉流与 SSE
    });
  })();
  </script>
</body>
</html>
